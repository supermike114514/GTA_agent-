; ============================================================
; GTA5Buddy 配置文件
; 改完保存，进游戏照常生效；若已装 -Junction，游戏内按 Insert 热重载也可以。
; 文件位置：游戏根目录（与 ScriptHookV.log 同级）或 scripts\ 目录，两处都会找。
; ============================================================

; 是否显示队友 HUD（名字 / 状态机状态 / 血量 / 护甲）
; true = 显示，false = 隐藏
hud=true

; 是否启用 F5 控制面板
menu=true

; 面板字体。
; ★ 如果面板里的中文显示成方块、空白或错位，就依次换成 labeled / monospace / leaderboard 试。
;   default     = ChaletLondon（SHVDN 默认，拉丁字形最完整，CJK 覆盖不确定）
;   labeled     = ChaletComprimeCologne
;   monospace   = RockstarTag
;   leaderboard = Leaderboard
font=default

; 面板左上角位置，取值 0.0 - 1.0（屏幕比例）
; 如果面板被小地图或其它 HUD 挡住，把 panelx / panely 调小或调大
panelx=0.03
panely=0.06

; 面板整体缩放倍率（1.0 = 默认大小）
panelscale=1.0
